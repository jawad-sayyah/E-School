<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn JavaScript, React, TypeScript and testing with short lessons, runnable code, quizzes and exercises."
    />
    <meta name="theme-color" content="#12152A" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>E School</title>
    <script>
      // Apply the saved theme before the first paint (dark is the default).
      try {
        if (localStorage.getItem('eschool-theme') === 'light') {
          document.documentElement.classList.replace('dark', 'light');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
